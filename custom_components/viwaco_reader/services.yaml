refresh:
  name: Refresh water meter data
  description: Retrieve latest meter readings and invoices. Leave customer code blank to refresh every VIWACO meter.
  fields:
    customer_id:
      name: Customer code
      description: Optional VIWACO customer code
      example: "000000001"
      selector:
        text:
reload:
  name: Reload integration
  description: Reload one or all VIWACO customer entries without restarting Home Assistant.
  fields:
    customer_id:
      name: Customer code
      description: Optional VIWACO customer code
      example: "000000001"
      selector:
        text:

archive_invoices:
  name: Lưu hóa đơn điện tử
  description: >
    Xác minh hóa đơn tại cổng VIWACO, tải PDF bản thể hiện nguyên bản (Mode=PDF) và tùy chọn tạo ảnh PNG trực tiếp từ PDF.
    vào /config/www/viwaco_reader. Có thể chạy thủ công; tự lưu chỉ chạy khi dữ liệu thanh toán thực sự thay đổi, được bật riêng trong Configure.
    Tệp trong www có thể truy cập không cần đăng nhập qua /local.
  fields:
    customer_id:
      name: Mã khách hàng
      description: Để trống để chạy cho tất cả khách hàng đã thêm.
      example: "000000001"
      selector:
        text: {}
    year:
      name: Năm
      description: 0 = tất cả các năm; hoặc nhập năm 2010-2100 (ví dụ 2026). Không nhập 1 để chỉ năm hiện tại.
      default: 0
      selector:
        number:
          min: 0
          max: 2100
          mode: box
    month:
      name: Tháng (tùy chọn)
      description: 0 = mọi tháng; 1-12 = tháng cụ thể. Khi chọn tháng phải nhập year cụ thể.
      default: 0
      selector:
        number:
          min: 0
          max: 12
          mode: box
    mode:
      name: Loại lưu trữ
      default: both
      selector:
        select:
          options:
            - label: Chi tiết số liệu (không tạo file)
              value: details
            - label: PDF gốc từ VIWACO
              value: pdf
            - label: PNG từ PDF gốc VIWACO
              value: png
            - label: Cả PDF và PNG
              value: both
    overwrite:
      name: Tải lại các kỳ đã lưu
      default: false
      selector:
        boolean: {}
    max_invoices:
      name: Giới hạn số kỳ
      description: 0 = tất cả kỳ phù hợp bộ lọc; 1-200 = lấy các kỳ mới nhất, xếp giảm dần năm/tháng.
      default: 0
      selector:
        number:
          min: 0
          max: 200
          mode: box
